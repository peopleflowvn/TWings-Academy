version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }

  # Security and bug-fix releases come automatically; major upgrades (and Django feature releases, e.g.
  # 6.1 -> 6.2 LTS) are planned changes made on purpose, not merged from a bot PR.
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      frontend-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      backend-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "django"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    groups:
      backend-docker:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /infra
    schedule: { interval: weekly }
    groups:
      infra-docker:
        patterns: ["*"]

  # LMS is upstream Moodle vendored code managed strictly via python infra/lms/vendor.py.
  # Dependabot should never open PRs touching /lms directly.
  - package-ecosystem: composer
    directory: /lms
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
