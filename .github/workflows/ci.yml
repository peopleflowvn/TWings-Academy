name: CI

# Runs on every PR (including forks) and on main. Uses NO secrets, so it is safe for public PRs.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1

  lms-vendor:
    name: LMS vendored code (upstream snapshots, documented patches)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the git subtree snapshots of lms/ live in history
          persist-credentials: false
      - name: lms/ matches infra/lms/vendor.json; every change to upstream code is in patches.txt
        run: python3 infra/lms/vendor.py check --github

  frontend:
    name: Frontend (type-check, build, audit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid
      - name: Bundle must not contain secrets
        run: |
          if grep -rEo '(re_[A-Za-z0-9]{20,}|whsec_[A-Za-z0-9+/=]{20,}|sk_live_[A-Za-z0-9]+)' dist; then
            echo "::error::Secret-looking string found in the public bundle"; exit 1
          fi
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend (lint, tests, deploy checks)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: twings_test
          POSTGRES_USER: twings
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twings" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://twings:ci-only-password@localhost:5432/twings_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes --no-deps -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest
      - name: Worker starts on Postgres (task queue tables, periodic schedule, one batch)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          TASKS_QUEUE: database
        run: |
          python manage.py migrate --noinput
          python manage.py ensure_schedule
          python manage.py db_worker --batch --no-startup-delay
      - name: Django deployment checklist (prod settings, dummy values)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
          DJANGO_ADMIN_URL: ops-ci/
          DJANGO_ALLOWED_HOSTS: api.example.invalid
          FIELD_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BLIND_INDEX_KEY: ci
          R2_ENDPOINT_URL: https://example.invalid
          R2_ACCESS_KEY_ID: x
          R2_SECRET_ACCESS_KEY: x
          R2_PUBLIC_BUCKET: x
          R2_PUBLIC_DOMAIN: media.example.invalid
          R2_PRIVATE_BUCKET: y
      - name: Django deployment checklist (prod settings without R2, local media)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: ci-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
          DJANGO_ADMIN_URL: ops-ci/
          DJANGO_ALLOWED_HOSTS: api.example.invalid
          FIELD_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          BLIND_INDEX_KEY: ci
          MEDIA_URL: https://api.example.invalid/media/
      - name: Dependency vulnerabilities (pip-audit)
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt

  e2e:
    name: Admissions screens in a browser (end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_DB: twings_e2e
          POSTGRES_USER: twings
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U twings" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://twings:ci-only-password@localhost:5432/twings_e2e
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-e2e-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyzABCDEF
      FIELD_ENCRYPTION_KEYS: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BLIND_INDEX_KEY: ci-e2e
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:3005
      DJANGO_CSRF_TRUSTED_ORIGINS: http://127.0.0.1:3005
      E2E_BASE: http://127.0.0.1:3005
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install --require-hashes --no-deps -r backend/requirements.txt
      - name: Playwright (pinned) and its Chromium
        run: |
          pip install playwright==1.54.0
          python -m playwright install --with-deps chromium
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the staff app against the local API
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
      - name: Database and test data (e2e/seed.py)
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py createcachetable
          python manage.py shell -c "exec(open('../e2e/seed.py', encoding='utf-8').read())"
      - name: Start the API and the web app
        run: |
          (cd backend && python manage.py runserver 127.0.0.1:8000 --noreload > ../runserver.log 2>&1 &)
          (cd frontend && npx vite preview --port 3005 --host 127.0.0.1 --strictPort > ../preview.log 2>&1 &)
          for i in $(seq 60); do
            curl -sf http://127.0.0.1:8000/api/v1/health/ > /dev/null && curl -sf http://127.0.0.1:3005/app > /dev/null && exit 0
            sleep 2
          done
          echo "::error::stack did not start"; cat runserver.log preview.log; exit 1
      - name: Admissions end-to-end test
        run: python e2e/admissions_test.py
        env:
          E2E_ARTIFACTS: e2e/artifacts
      - name: Screenshots and server logs (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts
            runserver.log
            preview.log
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: twings-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Web image (Caddy + React site)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/caddy/Dockerfile
          push: false
          load: true
          tags: twings-web:ci
          build-args: VITE_API_BASE_URL=https://api.example.invalid
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Caddyfile is valid
        run: |
          docker run --rm -e WEB_DOMAIN=web.example.invalid -e API_DOMAIN=api.example.invalid \
            twings-web:ci caddy validate --config /etc/caddy/Caddyfile
      - name: LMS image (Moodle)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/lms/Dockerfile
          push: false
          load: true
          tags: twings-lms:ci
          cache-from: type=gha,scope=lms
          cache-to: type=gha,mode=max,scope=lms
      - name: LMS config files and TWings plugins parse; Apache config is valid
        run: |
          docker run --rm twings-lms:ci sh -ec '
            php -l /var/www/moodle/config.php && php -l /var/www/moodle/twings_setup.php && apache2ctl -t
            for d in /var/www/moodle/public/local/twings /var/www/moodle/public/theme/twings; do
              if [ -d "$d" ]; then find "$d" -name "*.php" -print0 | xargs -0 -n1 php -l >/dev/null; fi
            done'
      - name: LMS installs from scratch on Postgres (core, plugins, TWings setup)
        run: |
          token=$(openssl rand -hex 16)
          echo "LMS_CI_TOKEN=$token" >> "$GITHUB_ENV"   # same token for the contract check below
          docker network create lms-ci
          docker run -d --name lms-ci-db --network lms-ci -e POSTGRES_USER=moodle -e POSTGRES_DB=moodle \
            -e POSTGRES_PASSWORD=ci-only-password \
            postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          for i in $(seq 30); do docker exec lms-ci-db pg_isready -q -U moodle -d moodle && break; sleep 2; done
          docker run --rm --network lms-ci -v lms-ci-data:/var/moodledata -e MOODLE_DB_HOST=lms-ci-db \
            -e MOODLE_DB_PASSWORD=ci-only-password -e MOODLE_HOSTS=lms.example.invalid -e MOODLE_UPGRADE_KEY=ci \
            -e MOODLE_WS_TOKEN="$token" twings-lms:ci sh -ec '
              cli=/var/www/moodle/admin/cli
              php $cli/install_database.php --agree-license --lang=en --adminuser=admin \
                --adminpass="Ci-only-password-1" --adminemail=admin@example.invalid --fullname="TWings CI" --shortname=CI >/dev/null
              php /var/www/moodle/twings_setup.php
              php $cli/upgrade.php --non-interactive >/dev/null
              php $cli/build_theme_css.php --themes=twings >/dev/null   # SCSS of theme_twings compiles
              [ "$(php $cli/cfg.php --name=theme)" = "twings" ] || { echo "::error::site theme is not twings"; exit 1; }
              for c in mod_attendance block_completion_progress report_customsql local_twings theme_twings; do
                v=$(php $cli/cfg.php --component=$c --name=version) || { echo "::error::$c not installed"; exit 1; }
                echo "$c $v"
              done'
      - name: Moodle contract check (the backend's real calls against this Moodle)
        run: |
          docker run -d --name lms --network lms-ci -v lms-ci-data:/var/moodledata -e MOODLE_DB_HOST=lms-ci-db \
            -e MOODLE_DB_PASSWORD=ci-only-password -e MOODLE_HOSTS=lms.example.invalid \
            -e MOODLE_WS_TOKEN="$LMS_CI_TOKEN" twings-lms:ci
          docker run --rm --network lms-ci -e DJANGO_SETTINGS_MODULE=config.settings.test \
            -e DATABASE_URL=sqlite:////tmp/contract.sqlite3 -e MOODLE_INTERNAL_URL=http://lms:8080/learn \
            -e MOODLE_HOST=lms.example.invalid -e MOODLE_WS_TOKEN="$LMS_CI_TOKEN" \
            twings-backend:ci sh -ec 'python manage.py migrate --noinput -v0 && python manage.py lms_contract_check' \
            || { docker logs lms | tail -40; exit 1; }
