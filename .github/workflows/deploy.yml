name: Deploy

# Runs only after CI succeeded for a push to main (never for pull requests), on the exact commit
# that CI tested. Production secrets live in the protected "production" environment.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/peopleflowvn/twings-academy-backend
  WEB_IMAGE: ghcr.io/peopleflowvn/twings-academy-web
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  guard:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - run: echo "Deploying ${SHA}"

  backend-image:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-image:
    needs: guard
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/caddy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          # Public configuration (repository variable), embedded in the JS bundle. "same-origin":
          # the site calls /api on its own host (served by the web container).
          build-args: VITE_API_BASE_URL=${{ vars.API_BASE_URL || 'same-origin' }}
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.SHA }}
            ${{ env.WEB_IMAGE }}:main
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-backend:
    needs: [backend-image, web-image]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Roll out on the VPS (restricted forced-command key)
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          # Pinned host key: never trust-on-first-use in CI.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes \
              -o ConnectTimeout=20 "deploy@${VPS_HOST}" "deploy ${SHA}"
      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # Optional extra copy of the site on Cloudflare Pages (the VPS already serves it); runs only when
  # the CF_PAGES_PROJECT repository variable is set.
  deploy-frontend:
    needs: guard
    if: vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-24.04
    environment: production
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Build (API URL is public configuration, stored as a repository variable)
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
      - name: Inject API origin into the Content-Security-Policy
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          origin="$(printf '%s' "$API_BASE_URL" | sed -E 's#^(https://[^/]+).*#\1#')"
          [[ "$origin" =~ ^https://[a-z0-9.-]+$ ]] || { echo "::error::API_BASE_URL must be https://host"; exit 1; }
          sed -i "s#__API_ORIGIN__#${origin}#g" dist/_headers
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.146.0 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main
