# gitleaks configuration: default rules + allowlist for documented throwaway test values.
[extend]
useDefault = true

[allowlist]
description = "Throwaway values used only by the test suite / build step"
paths = [
  '''backend/config/settings/test\.py''',
  '''backend/tests/.*''',
  '''.*\.example$''',
  '''.*package-lock\.json$''',
  '''backend/requirements.*\.txt$''',
]
# Verbatim upstream snapshots of lms/ (Moodle core + plugins, git subtree squash commits): their sample
# keys and SDK fixtures are upstream's. Any TWings commit touching lms/ is still scanned.
# Maintained by infra/lms/vendor.py.
