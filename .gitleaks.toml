# gitleaks configuration: default rules + allowlist for documented throwaway test values.
[extend]
useDefault = true

[allowlist]
description = "Throwaway values used only by the test suite / build step"
paths = [
  '''backend/config/settings/test\.py''',
  '''backend/tests/.*''',
  '''.*\.example$''',
  '''.*package-lock\.json$''',
  '''backend/requirements.*\.txt$''',
]
regexes = [
  # Fake placeholder generated by AI Studio in commit cb4c0d5 (not a real Resend secret; removed since).
  '''whsec_9a8b7c6d5e4f3a2b1c0d_msb''',
  '''AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=''',
  '''ci-only-password''',
]
