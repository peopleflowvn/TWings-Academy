<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="twGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0050D8" />
      <stop offset="50%" stop-color="#0073C1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003580" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="8" y="8" width="112" height="112" rx="30" fill="url(#twGrad)" filter="url(#shadow)" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  <!-- TW Monogram Text -->
  <text x="64" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central" letter-spacing="-2">TW</text>
  <!-- Brand orange dot -->
  <circle cx="98" cy="98" r="9" fill="#EA580C" stroke="#FFFFFF" stroke-width="2.5" />
</svg>
