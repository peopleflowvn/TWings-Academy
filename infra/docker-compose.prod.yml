# Production stack on the shared Oracle VPS (/opt/twings/docker-compose.yml).
#
#   Internet ─HTTPS─▶ shared gateway (another product's Caddy) ─▶ web:8080 ─┬─▶ React site
#                                                                          └─▶ backend:8000 ─▶ db
#
# The host also runs other products, so this stack publishes NO host port, touches no Docker/SSH
# settings, and is capped in memory/CPU priority. Network isolation:
#   gateway  (external)  web only     – what the shared gateway can reach
#   app      (internal)  web, backend – no internet
#   data     (internal)  backend, db  – no internet; web and other products cannot reach the DB
#   egress               backend      – Resend, R2
# Secrets live in /opt/twings/env/*.env (root-owned, chmod 600), never in this file or the images.
# IMAGE_TAG is written to /opt/twings/.env by bin/deploy.sh.

name: twings

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  # Half the default CPU weight: on the single shared vCPU the other products win under contention.
  cpu_shares: 512
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    env_file: [./env/db.env]
    # Small-footprint tuning for a shared 6 GB host.
    command: >-
      postgres -c shared_buffers=64MB -c effective_cache_size=256MB -c work_mem=4MB
      -c maintenance_work_mem=32MB -c max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    shm_size: 128mb
    mem_limit: 320m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/backend.env]
    environment:
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
    depends_on:
      db: { condition: service_healthy }
    networks: [app, data, egress]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - appdata:/data         # uploads when R2 is not configured
    cap_drop: [ALL]
    mem_limit: 448m
    pids_limit: 128

  # Caddy + built React site + Caddyfile (infra/caddy/Dockerfile), same tag as the backend.
  web:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/caddy.env]  # WEB_DOMAIN, API_DOMAIN
    volumes:
      - appdata:/srv/appdata:ro
    depends_on: [backend]
    networks:
      app: {}
      gateway:
        aliases: [twings-web]   # target used in the shared gateway's Caddyfile
    read_only: true
    tmpfs: ["/tmp", "/data", "/config"]
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64

networks:
  app:
    internal: true
  data:
    internal: true
  egress: {}
  gateway:
    external: true
    # Docker network of the shared gateway; from env/gateway.env, copied into .env by deploy.sh.
    name: ${GATEWAY_NETWORK:?GATEWAY_NETWORK is not set}

volumes:
  pgdata: {}
  appdata: {}
