# Production stack on the shared Oracle VPS (/opt/twings/docker-compose.yml).
#
#   Internet ─HTTPS─▶ shared gateway (another product's Caddy) ─▶ web:8080 ─┬─▶ React site
#                                                                          └─▶ backend:8000 ─▶ db
#
# The host also runs other products, so this stack publishes NO host port, touches no Docker/SSH
# settings, and is capped in memory/CPU priority. Network isolation:
#   gateway  (external)  web only     – what the shared gateway can reach
#   app      (internal)  web, backend, worker, lms – no internet
#   data     (internal)  backend, worker, lms, db – no internet; web and other products cannot reach the DB
#   egress               backend, worker, lms – Resend, R2, Moodle language packs and mail
#   worker: same image as backend, runs queued tasks and the periodic jobs (no host cron)
#   lms: Moodle at <site>/learn, reached through web (app network); its DB lives in the same Postgres
# Secrets live in /opt/twings/env/*.env (root-owned, chmod 600), never in this file or the images.
# IMAGE_TAG is written to /opt/twings/.env by bin/deploy.sh.

name: twings

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  # Half the default CPU weight: on the single shared vCPU the other products win under contention.
  cpu_shares: 512
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    env_file: [./env/db.env]
    # Small-footprint tuning for a shared 6 GB host.
    command: >-
      postgres -c shared_buffers=64MB -c effective_cache_size=256MB -c work_mem=4MB
      -c maintenance_work_mem=32MB -c max_connections=50
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [data]
    shm_size: 128mb
    mem_limit: 320m
    pids_limit: 200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/backend.env]
    environment:
      GUNICORN_WORKERS: "2"
      GUNICORN_THREADS: "4"
      TASKS_QUEUE: database   # Moodle calls etc. are queued for the worker
    depends_on:
      db: { condition: service_healthy }
    networks: [app, data, egress]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - appdata:/data         # uploads when R2 is not configured
    cap_drop: [ALL]
    mem_limit: 448m
    pids_limit: 128

  # Background work queued in Postgres (django.tasks): Moodle enrolment / intake provisioning / account
  # sync after commit, and the periodic jobs (apps/core/schedule.py) that used to be host cron entries.
  worker:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/backend.env]
    environment:
      TASKS_QUEUE: database
    command: ["sh", "-c", "python manage.py ensure_schedule && exec python manage.py db_worker --interval 2 --no-startup-delay"]
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }
    networks: [app, data, egress]   # app: Moodle web services; egress: Resend, R2
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - appdata:/data
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 64

  # Caddy + built React site + Caddyfile (infra/caddy/Dockerfile), same tag as the backend.
  web:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/caddy.env]  # WEB_DOMAIN, API_DOMAIN
    volumes:
      - appdata:/srv/appdata:ro
    depends_on: [backend]
    networks:
      app: {}
      gateway:
        aliases: [twings-web]   # target used in the shared gateway's Caddyfile
    read_only: true
    tmpfs: ["/tmp", "/data", "/config"]
    cap_drop: [ALL]
    mem_limit: 64m
    pids_limit: 64

  # Moodle LMS at <site>/learn (infra/lms/Dockerfile): reached only through the web container.
  lms:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-lms:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/lms.env]
    depends_on:
      db: { condition: service_healthy }
    networks: [app, data, egress]   # egress: language packs, outgoing mail
    read_only: true
    tmpfs: ["/tmp", "/var/run/apache2", "/var/lock/apache2"]
    volumes:
      - moodledata:/var/moodledata
    cap_drop: [ALL]
    mem_limit: 512m
    pids_limit: 128

  # Moodle's scheduled + ad-hoc tasks (e-mails, completion, badges...), same image.
  lms-cron:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-lms:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/lms.env]
    command: ["sh", "-c", "while :; do php /var/www/moodle/admin/cli/cron.php --keep-alive=300; sleep 10; done"]
    healthcheck: { disable: true }
    depends_on: [lms]
    networks: [app, data, egress]   # app: learning events to http://backend:8000 (local_twings)
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - moodledata:/var/moodledata
    cap_drop: [ALL]
    mem_limit: 256m
    pids_limit: 64

networks:
  app:
    internal: true
  data:
    internal: true
  egress: {}
  gateway:
    external: true
    # Docker network of the shared gateway; from env/gateway.env, copied into .env by deploy.sh.
    name: ${GATEWAY_NETWORK:?GATEWAY_NETWORK is not set}

volumes:
  pgdata: {}
  appdata: {}
  moodledata: {}
