# Production stack on the Oracle VPS (/opt/twings/docker-compose.yml).
#
#   Internet ──HTTPS :443──▶ caddy (Let's Encrypt TLS) ──▶ backend:8000 ──▶ db
#
# Only caddy publishes ports (80/443); backend and db are unreachable from outside. Secrets live in
# /opt/twings/env/*.env (root-owned, chmod 600) and never in this file or the image.
# IMAGE_TAG is written to /opt/twings/.env by bin/deploy.sh.

name: twings

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    env_file: [./env/db.env]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/backend.env]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, egress]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256

  caddy:
    <<: *hardening
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    env_file: [./env/caddy.env]  # API_DOMAIN, ACME_EMAIL
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates: keep across restarts (Let's Encrypt rate limits)
      - caddy_config:/config
    depends_on: [backend]
    networks: [egress]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m

networks:
  # Database network has no route to the internet.
  internal:
    internal: true
  # Backend (Resend, R2) and caddy (ACME, public traffic) need outbound access.
  egress: {}

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
