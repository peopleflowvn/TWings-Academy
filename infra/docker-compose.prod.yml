# Production stack on the Oracle VPS (/opt/twings/docker-compose.yml).
#
#   Internet ──HTTPS :443──▶ caddy (Let's Encrypt TLS) ──┬─▶ React site (WEB_DOMAIN, static files)
#                                                        └─▶ backend:8000 (API_DOMAIN) ──▶ db
#
# Only caddy publishes ports (80/443); backend and db are unreachable from outside. Secrets live in
# /opt/twings/env/*.env (root-owned, chmod 600) and never in this file or the image.
# IMAGE_TAG is written to /opt/twings/.env by bin/deploy.sh.

name: twings

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  db:
    <<: *hardening
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    env_file: [./env/db.env]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-backend:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/backend.env]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal, egress]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - appdata:/data         # uploads when R2 is not configured
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 256

  # Caddy + built React site + Caddyfile (infra/caddy/Dockerfile), same tag as the backend.
  caddy:
    <<: *hardening
    image: ghcr.io/peopleflowvn/twings-academy-web:${IMAGE_TAG:?IMAGE_TAG is not set}
    env_file: [./env/caddy.env]  # WEB_DOMAIN, API_DOMAIN
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - caddy_data:/data      # certificates: keep across restarts (Let's Encrypt rate limits)
      - caddy_config:/config
      - appdata:/srv/appdata:ro
    depends_on: [backend]
    networks: [egress]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 256m

networks:
  # Database network has no route to the internet.
  internal:
    internal: true
  # Backend (Resend, R2) and caddy (ACME, public traffic) need outbound access.
  egress: {}

volumes:
  pgdata: {}
  appdata: {}
  caddy_data: {}
  caddy_config: {}
