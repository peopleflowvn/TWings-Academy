# Apache site for the TWings Moodle container: plain HTTP on :8080 (unprivileged), Moodle at /learn.
# The web container proxies <site>/learn/* here; TLS terminates at the shared gateway.
Listen 8080

# Small, bounded worker pool on a shared host. Each PHP worker may use up to memory_limit (256 MB,
# php.ini) during heavy requests (course copy = backup/restore) and holds a Postgres connection:
# 4 workers keep the container within its 512 MB in practice and Moodle well under max_connections.
# Further requests wait in Apache's queue instead of getting the container OOM-killed.
<IfModule mpm_prefork_module>
    StartServers            2
    MinSpareServers         1
    MaxSpareServers         2
    MaxRequestWorkers       4
    MaxConnectionsPerChild  500
</IfModule>

<VirtualHost *:8080>
    ServerName localhost
    DocumentRoot /var/www/empty

    # Moodle 5.x serves everything from public/; config.php and lib/ stay outside the web root.
    Alias /learn /var/www/moodle/public
    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        AcceptPathInfo On
    </Directory>

    <Directory /var/www/empty>
        Require all denied
    </Directory>

    # Never serve dotfiles or composer metadata.
    <LocationMatch "(/\.|composer\.(json|lock))">
        Require all denied
    </LocationMatch>

    ErrorLog /dev/stderr
    # No access log: requests may carry personal data in query strings.
    ServerSignature Off
</VirtualHost>
